[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-agent-explorer"
version = "0.1.0"
description = "A small inspectable synthetic clinical-agent harness"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
clinical-agent-explorer = "clinical_agent_explorer.cli:main"
clinical-agent-explorer-phase1 = "clinical_agent_explorer_phase1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
